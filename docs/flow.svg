<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 300" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
  <title id="title">Paycue bounty flow</title>
  <desc id="desc">An issue moves through pull request, merge, policy check, and payout.</desc>
  <rect width="1320" height="300" fill="#ffffff"/>
  <g fill="none" stroke="#001CE0" stroke-width="4" stroke-linecap="square" stroke-linejoin="miter">
    <rect x="32" y="32" width="208" height="200"/>
    <rect x="284" y="32" width="208" height="200"/>
    <rect x="536" y="32" width="208" height="200"/>
    <rect x="788" y="32" width="208" height="200"/>
    <rect x="1040" y="32" width="208" height="200"/>
    <path d="M244 132H272 M260 120L272 132 260 144"/>
    <path d="M496 132H524 M512 120L524 132 512 144"/>
    <path d="M748 132H776 M764 120L776 132 764 144"/>
    <path d="M1000 132H1028 M1016 120L1028 132 1016 144"/>
  </g>

  <!-- Issue document -->
  <g fill="#001CE0">
    <rect x="112" y="60" width="48" height="8"/>
    <rect x="104" y="68" width="64" height="72"/>
    <rect x="120" y="84" width="32" height="8" fill="#ffffff"/>
    <rect x="120" y="100" width="32" height="8" fill="#ffffff"/>
    <rect x="120" y="116" width="24" height="8" fill="#ffffff"/>
  </g>

  <!-- Pull request: two branches joined by a review -->
  <g fill="none" stroke="#001CE0" stroke-width="8" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M344 72V144Q344 160 360 160H408Q424 160 424 144V112"/>
    <path d="M408 72V112"/>
  </g>
  <g fill="#001CE0">
    <rect x="336" y="64" width="16" height="16"/>
    <rect x="400" y="64" width="16" height="16"/>
    <rect x="400" y="104" width="16" height="16"/>
    <rect x="416" y="128" width="16" height="16"/>
  </g>

  <!-- Merge: two branches converge into one -->
  <g fill="none" stroke="#001CE0" stroke-width="8" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M592 72V112Q592 128 608 128H640Q656 128 656 112V72"/>
    <path d="M624 160V128"/>
  </g>
  <g fill="#001CE0">
    <rect x="584" y="64" width="16" height="16"/>
    <rect x="648" y="64" width="16" height="16"/>
    <rect x="616" y="152" width="16" height="16"/>
  </g>

  <!-- Policy check: pixel shield and checkmark -->
  <g fill="#001CE0">
    <rect x="864" y="64" width="48" height="8"/>
    <rect x="856" y="72" width="64" height="8"/>
    <rect x="856" y="80" width="8" height="48"/>
    <rect x="912" y="80" width="8" height="48"/>
    <rect x="864" y="128" width="48" height="8"/>
    <rect x="872" y="136" width="32" height="8"/>
    <rect x="880" y="144" width="16" height="8"/>
    <rect x="872" y="104" width="8" height="8" fill="#ffffff"/>
    <rect x="880" y="112" width="8" height="8" fill="#ffffff"/>
    <rect x="888" y="104" width="8" height="8"/>
    <rect x="896" y="96" width="8" height="8"/>
    <rect x="904" y="88" width="8" height="8"/>
  </g>

  <!-- Payout: pixel coin with a check -->
  <g fill="#001CE0">
    <rect x="1112" y="64" width="48" height="8"/>
    <rect x="1104" y="72" width="64" height="8"/>
    <rect x="1096" y="80" width="80" height="64"/>
    <rect x="1104" y="144" width="64" height="8"/>
    <rect x="1112" y="152" width="48" height="8"/>
    <rect x="1128" y="88" width="16" height="8" fill="#ffffff"/>
    <rect x="1120" y="96" width="32" height="8" fill="#ffffff"/>
    <rect x="1128" y="104" width="24" height="8" fill="#ffffff"/>
    <rect x="1136" y="112" width="16" height="8" fill="#ffffff"/>
    <rect x="1144" y="120" width="8" height="8" fill="#ffffff"/>
    <rect x="1152" y="104" width="8" height="8" fill="#ffffff"/>
  </g>

  <g fill="#001CE0" font-family="monospace" font-size="20" font-weight="700" text-anchor="middle">
    <text x="136" y="204">ISSUE</text>
    <text x="388" y="204">PULL REQUEST</text>
    <text x="640" y="204">MERGE</text>
    <text x="892" y="204">POLICY CHECK</text>
    <text x="1144" y="204">PAYOUT</text>
  </g>
</svg>
